<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>商品海报工坊</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="商品海报工坊"><span class="brand-mark"><img src="assets/icons/layout-template.svg" alt=""></span><strong>商品海报工坊</strong><span class="brand-size">竖版 ¼ A4</span></a>
    <div class="top-actions">
      <span id="saveState" class="save-state"><i></i><span>准备就绪</span></span>
      <button class="icon-button" id="undoBtn" title="撤销" aria-label="撤销" disabled><img src="assets/icons/undo-2.svg" alt=""></button>
      <button class="icon-button" id="redoBtn" title="重做" aria-label="重做" disabled><img src="assets/icons/redo-2.svg" alt=""></button>
      <span class="action-divider"></span>
      <button class="btn secondary" id="printBtn"><img src="assets/icons/printer.svg" alt=""><span>打印</span></button>
      <button class="btn primary" id="exportBtn"><img src="assets/icons/download.svg" alt=""><span>导出图片</span></button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <nav class="editor-tabs" aria-label="编辑面板"><button class="active" data-tab="content" aria-selected="true"><img src="assets/icons/tag.svg" alt="">商品内容</button><button data-tab="appearance" aria-selected="false"><img src="assets/icons/settings-2.svg" alt="">样式设置</button></nav>
      <div class="sidebar-scroll">
        <div id="contentPanel">
          <section class="panel-section presets-section">
            <div class="section-title"><h2>参考内容</h2><span>来自文件夹照片</span></div>
            <div class="presets"><button class="preset" data-preset="desktop"><img class="reference-photo" src="assets/reference-desktop.jpg" alt="台式机参考海报"><span><strong>台式机配置</strong><small>8 项参数</small></span></button><button class="preset" data-preset="laptop"><img class="reference-photo" src="assets/reference-laptop.jpg" alt="笔记本参考海报"><span><strong>笔记本配置</strong><small>7 项参数</small></span></button></div>
          </section>
          <section class="panel-section">
            <div class="section-title"><h2>基本信息</h2></div>
            <label class="field"><span>门店名称</span><input id="storeInput" maxlength="40" autocomplete="off"></label>
            <label class="field"><span>商品名称</span><input id="titleInput" maxlength="60" autocomplete="off" placeholder="输入商品名称"></label>
            <div class="two-fields"><label class="field"><span>促销字样</span><input id="badgeInput" maxlength="12" placeholder="例如：促销"></label><label class="field"><span>价格</span><input id="priceInput" maxlength="16" inputmode="decimal" placeholder="留空显示询价"></label></div>
            <label class="field"><span>副标题</span><input id="subtitleInput" maxlength="80" placeholder="可留空"></label>
          </section>
          <section class="panel-section"><div class="section-title"><h2>商品参数</h2><span id="detailCount">8 / 10</span><button id="addDetail" class="icon-button small" title="添加参数" aria-label="添加参数"><img src="assets/icons/plus.svg" alt=""></button></div><div id="detailsFields"></div></section>
          <section class="panel-section"><div class="section-title"><h2>补充内容</h2></div><label class="field"><span>商品描述</span><textarea id="descriptionInput" rows="3" maxlength="240" placeholder="可留空"></textarea></label><label class="field"><span>底部备注</span><input id="footerInput" maxlength="80" placeholder="例如：联系电话、地址"></label></section>
          <section class="panel-section photo-section"><div class="section-title"><h2>商品图片</h2><span>可选</span></div><input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden><button id="uploadImage" class="upload-button"><img src="assets/icons/image-plus.svg" alt=""><span id="imageLabel">选择商品图片</span></button><div id="imageControls" hidden><div class="image-settings"><label for="imageCrop">底部裁切</label><input id="imageCrop" type="range" min="0" max="25" step="1"><output id="cropValue">0%</output><button class="icon-button small" id="clearImage" title="移除图片" aria-label="移除图片"><img src="assets/icons/trash-2.svg" alt=""></button></div></div></section>
        </div>
        <div id="appearancePanel" hidden>
          <section class="panel-section"><div class="section-title"><h2>主题颜色</h2></div><div class="swatches" id="swatches"></div><label class="color-field">自定义颜色<input type="color" id="accentInput" value="#e52939"></label></section>
          <section class="panel-section">
            <div class="section-title"><h2>文字与布局</h2></div>
            <label class="field"><span>字号</span><div class="range-field"><input id="textScale" type="range" min="85" max="115" step="5" value="100"><output id="textScaleValue">100%</output></div></label>
            <label class="toggle-field"><span>参数编号</span><input type="checkbox" id="numberedInput"></label>
            <label class="field"><span>参数排版</span><select id="rowStyleInput"><option value="auto">随模板</option><option value="pills">圆角边框</option><option value="lines">简洁分隔线</option><option value="blocks">色块标签</option></select></label>
            <div class="two-fields"><label class="field"><span>货币</span><select id="currencyInput"><option value="¥">人民币 ¥</option><option value="$">美元 $</option><option value="€">欧元 €</option><option value="">无符号</option></select></label><label class="field"><span>价格标签</span><input id="priceLabelInput" maxlength="12"></label></div>
          </section>
          <section class="panel-section"><div class="section-title"><h2>导出与打印</h2></div><label class="field"><span>导出清晰度</span><select id="qualityInput"><option value="300">高清打印 · 300 DPI</option><option value="150">轻量图片 · 150 DPI</option></select></label><label class="field"><span>打印排版</span><select id="printLayoutInput"><option value="four">A4 四张拼版</option><option value="one">四分之一 A4 单张</option></select></label><dl class="format-info"><div><dt>纸张尺寸</dt><dd>105 × 148.5 毫米</dd></div><div><dt>图片尺寸</dt><dd id="pixelDimensions">1240 × 1754 像素</dd></div><div><dt>字体</dt><dd>思源黑体</dd></div></dl></section>
        </div>
      </div>
      <footer class="sidebar-footer"><button class="btn secondary" id="saveProject"><img src="assets/icons/save.svg" alt="">保存方案</button><button class="icon-button" id="loadProject" title="打开方案" aria-label="打开方案"><img src="assets/icons/file-up.svg" alt=""></button><button class="icon-button" id="resetBtn" title="重置内容" aria-label="重置内容"><img src="assets/icons/rotate-ccw.svg" alt=""></button><input type="file" id="projectInput" accept=".json,application/json" hidden></footer>
    </aside>
    <section class="preview-area">
      <div class="template-section"><div class="section-title"><h2>海报风格</h2><span id="currentStyleName">经典促销</span></div><div class="template-picker" id="stylePicker" aria-label="海报风格"></div></div>
      <div class="preview-toolbar"><div><span class="preview-dot"></span><strong>实时预览</strong><span class="size-label">105 × 148.5 毫米 · 竖版</span></div><button class="icon-button" id="fullscreenBtn" title="放大预览" aria-label="放大预览"><img src="assets/icons/maximize.svg" alt=""></button></div>
      <div class="canvas-stage"><div class="paper"><canvas id="posterCanvas" width="1050" height="1485" aria-label="竖版四分之一 A4 商品海报"></canvas></div></div>
      <div class="preview-foot"><span>竖版四分之一 A4</span><span id="fontState">正在加载思源黑体…</span></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="previewDialog"><div class="dialog-header"><strong>海报预览</strong><button class="icon-button" id="closePreview" aria-label="关闭预览" title="关闭预览"><img src="assets/icons/x.svg" alt=""></button></div><img id="largePreview" alt="竖版商品海报"></dialog>
  <dialog id="resetDialog"><div class="confirm-content"><h2>重置当前海报？</h2><p>恢复默认内容和样式。</p><div class="confirm-actions"><button class="btn secondary" id="cancelReset">取消</button><button class="btn primary" id="confirmReset">重置</button></div></div></dialog>
  <div id="printSheet" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
